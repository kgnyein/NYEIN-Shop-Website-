    .btn-admin { background: #1877f2; color: white; white-space: nowrap; margin-left: 8px; }
    .btn-edit { background: #e4e6eb; color: #050505; width: 100%; margin-top: auto; }

    .edit-form { display: none; margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; }
    .edit-form label { font-size: 11px; color: #555; display: block; margin-bottom: 2px; }
    .edit-form input { width: 100%; margin-bottom: 6px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
  </style>

    // ၃။ Admin Password
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = '071065';
    let isAdmin = false;

    function handleAdminLogin() {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('admin-toggle-btn').innerText = 'Admin Login';
        renderProducts();
        return;
      }
      const user = prompt('Admin Username:');
      const pass = prompt('Admin Password:');
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-toggle-btn').innerText = 'Logout';
        alert('Admin Login အောင်မြင်ပါသည်။');
        renderProducts();
      } else {
        alert('Username သို့မဟုတ် Password မှားယွင်းနေပါသည်!');
      }
    }

    function toggleEditBox(sku) {
      const box = document.getElementById(`edit-box-${sku}`);
      if (box) {
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
      }
    }

    async function saveProduct(sku) {
      if (!supabase) {
        alert('Database ချိတ်ဆက်မရသေးပါ!');
        return;
      }
      const name = document.getElementById(`input-name-${sku}`).value;
      const price = parseFloat(document.getElementById(`input-price-${sku}`).value) || 0;
      const img = document.getElementById(`input-img-${sku}`).value;

      const { error } = await supabase
        .from('custom_items')
        .upsert({ sku: String(sku), item_name: name, price: price, image_url: img });

      if (error) {
        alert('သိမ်းဆည်းရာတွင် အမှားဖြစ်သွားပါသည်: ' + error.message);
      } else {
        alert('သိမ်းဆည်းပြီးပါပြီ!');
        renderProducts();
      }
    }

    async function renderProducts() {
      const container = document.getElementById('product-grid');

      let overrideMap = {};
      if (supabase) {
        try {
          const { data: dbData } = await supabase.from('custom_items').select('*');
          (dbData || []).forEach(row => { overrideMap[String(row.sku)] = row; });
        } catch(e) {
          console.warn("Supabase fetch failed:", e);
        }
      }

      container.innerHTML = '';

      rawItems.forEach(item => {
        const sku = String(item.sku);
        const custom = overrideMap[sku] || {};

        const displayName = custom.item_name || item.name;
        const displayPrice = (custom.price !== undefined && custom.price !== null) ? custom.price : item.price;
        const displayImg = custom.image_url || 'https://placehold.co/200x160/e4e6eb/65676b?text=No+Image';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${displayImg}" alt="${displayName}">
          <div class="title">${displayName}</div>
          <div class="price">THB ${displayPrice}</div>
          <div class="sku">SKU: ${sku}</div>
          <div class="stock">လက်ကျန်: ${item.stock} ခု</div>
          
          ${isAdmin ? `
            <button class="btn btn-edit" onclick="toggleEditBox('${sku}')">✏️ Edit</button>
            <div id="edit-box-${sku}" class="edit-form">
              <label>အမည်:</label>
              <input type="text" id="input-name-${sku}" value="${displayName}">
              <label>ဈေးနှုန်း (THB):</label>
              <input type="number" id="input-price-${sku}" value="${displayPrice}">
              <label>Image Direct Link:</label>
              <input type="text" id="input-img-${sku}" value="${custom.image_url || ''}" placeholder="https://...">
              <button class="btn btn-save" onclick="saveProduct('${sku}')">💾 Save</button>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    renderProducts();
