    function loadDatabase() {
      try {
        document.getElementById('status-msg').style.display = 'none';
        renderCards(allItems);
        initSupabase();
      } catch(e) {
        document.getElementById('status-msg').innerText = "⚠️ Data ဖွင့်ရာတွင် အမှားဖြစ်သွားပါသည်။";
        console.error(e);
      }
    }

    function initSupabase() {
      try {
        if (window.supabase) {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          fetchOverrides();
        }
      } catch(e) {
        console.warn("Supabase init error:", e);
      }
    }

    async function fetchOverrides() {
      if (!client) return;
      try {
        const { data } = await client.from('custom_items').select('*');
        if (data) {
          data.forEach(row => { overrideMap[String(row.sku)] = row; });
          renderCards(allItems);
        }
      } catch(e) {
        console.warn("Override load error:", e);
      }
    }

    function handleAdminLogin() {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('admin-toggle-btn').innerText = 'Admin';
        renderCards(allItems);
        return;
      }
      const user = prompt('Admin Username:');
      const pass = prompt('Admin Password:');
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-toggle-btn').innerText = 'Logout';
        renderCards(allItems);
      } else {
        alert('Password မှားယွင်းနေပါသည်!');
      }
    }

    function toggleEditBox(sku) {
      const box = document.getElementById(`edit-box-${sku}`);
      if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function saveProduct(sku) {
      if (!client) {
        alert('Database ချိတ်ဆက်မရသေးပါ!');
        return;
      }
      const name = document.getElementById(`input-name-${sku}`).value;
      const price = parseFloat(document.getElementById(`input-price-${sku}`).value) || 0;
      const stock = parseInt(document.getElementById(`input-stock-${sku}`).value) || 0;
      const img = document.getElementById(`input-img-${sku}`).value;

      const { error } = await client
        .from('custom_items')
        .upsert({ sku: String(sku), item_name: name, price: price, stock: stock, image_url: img });

      if (error) {
        alert('အမှားဖြစ်သွားပါသည်: ' + error.message);
      } else {
        overrideMap[String(sku)] = { sku: String(sku), item_name: name, price: price, stock: stock, image_url: img };
        alert('သိမ်းဆည်းပြီးပါပြီ!');
        renderCards(allItems);
      }
    }

    function addToCart(sku, name, price) {
      if (cart[sku]) {
        cart[sku].qty += 1;
      } else {
        cart[sku] = { name: name, price: parseFloat(price), qty: 1 };
      }
      updateCartBadge();
      alert('ပစ္စည်းကို ခြင်းထဲသို့ ထည့်ပြီးပါပြီ။ 🛒');
    }

    function updateCartBadge() {
      let totalQty = 0;
      for (let sku in cart) totalQty += cart[sku].qty;
      document.getElementById('cart-count').innerText = totalQty;
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total-price');
      container.innerHTML = '';
      
      let totalAmount = 0;
      let hasItems = false;

      for (let sku in cart) {
        hasItems = true;
        let item = cart[sku];
        let subtotal = item.price * item.qty;
        totalAmount += subtotal;

        container.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <b>${item.name}</b><br>
              <small>${item.price} THB x ${item.qty}</small>
            </div>
            <div class="cart-item-qty">${subtotal} THB</div>
          </div>
        `;
      }

      if (!hasItems) {
        container.innerHTML = '<p style="text-align:center; font-size:13px;">ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>';
      }

      totalEl.innerText = `စုစုပေါင်း: ${totalAmount} THB`;
      document.getElementById('cart-modal').style.display = 'block';
    }

    function closeCartModal() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    async function submitOrder() {
      if (Object.keys(cart).length === 0) {
        alert('ဝယ်ယူမည့် ပစ္စည်းများကို အရင်ရွေးချယ်ပါ။');
        return;
      }

      const name = document.getElementById('order-name').value.trim();
      const address = document.getElementById('order-address').value.trim();
      const phone = document.getElementById('order-phone').value.trim();

      if (!name || !address || !phone) {
        alert('ကျေးဇူးပြု၍ အမည်၊ လိပ်စာ နှင့် ဖုန်းနံပါတ်တို့ကို ပြည့်စုံစွာ ဖြည့်ပေးပါ။');
        return;
      }

      let text = `📦 <b>ဈေးဝယ်ယူမှု အော်ဒါအသစ်</b>\n`;
      text += `━━━━━━━━━━━━━━━━━━━━\n`;
      text += `👤 <b>အမည်:</b> ${name}\n`;
      text += `📍 <b>လိပ်စာ:</b> ${address}\n`;
      text += `📞 <b>ဖုန်း:</b> ${phone}\n`;
      text += `━━━━━━━━━━━━━━━━━━━━\n`;
      
      let total = 0;
      let i = 1;
      for (let sku in cart) {
        let item = cart[sku];
        let sub = item.price * item.qty;
        total += sub;
        text += `${i}. ${item.name}\n   └ ${item.qty} ခု x ${item.price} = <b>${sub} THB</b>\n`;
        i++;
      }
      text += `━━━━━━━━━━━━━━━━━━━━\n`;
      text += `💰 <b>စုစုပေါင်း: ${total} THB</b>`;

      const submitBtn = document.querySelector('.btn-save');
      submitBtn.innerText = '⏳ ပေးပို့နေပါသည်...';
      submitBtn.disabled = true;

      try {
        const encodedText = encodeURIComponent(text);
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodedText}&parse_mode=HTML`;

        const res = await fetch(url);

        if (res.ok) {
          alert('အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။ ဆိုင်မှ မကြာမီ ဆက်သွယ်ပေးပါမည်။');
          cart = {};
          updateCartBadge();
          closeCartModal();
          document.getElementById('order-name').value = '';
          document.getElementById('order-address').value = '';
          document.getElementById('order-phone').value = '';
        } else {
          alert('Telegram သို့ ပို့ရာတွင် အမှားဖြစ်သွားပါသည်။');
        }
      } catch (err) {
        alert('Internet ချိတ်ဆက်မှု စစ်ဆေးပါ။ (သို့မဟုတ် Brave Browser ၏ Shields ကို ပိတ်ပြီး စမ်းကြည့်ပါ)');
      } finally {
        submitBtn.innerText = '✅ ဝယ်ယူမည်';
        submitBtn.disabled = false;
      }
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (!query) {
        renderCards(allItems);
        return;
      }
      const filtered = allItems.filter(item => {
        const sku = String(item.sku).toLowerCase();
        const custom = overrideMap[sku] || {};
        const name = (custom.item_name || item.name).toLowerCase();
        return name.includes(query) || sku.includes(query);
      });
      renderCards(filtered);
    }

    function renderCards(items) {
      const container = document.getElementById('product-grid');
      container.innerHTML = '';

      items.forEach(item => {
        const sku = String(item.sku);
        const custom = overrideMap[sku] || {};

        const displayName = custom.item_name || item.name;
        const safeName = displayName.replace(/'/g, "\\\'").replace(/"/g, "&quot;");
        const displayPrice = (custom.price !== undefined && custom.price !== null) ? custom.price : item.price;
        const displayStock = (custom.stock !== undefined && custom.stock !== null) ? custom.stock : item.stock;
        const displayImg = custom.image_url || 'https://placehold.co/200x160/e4e6eb/65676b?text=No+Image';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${displayImg}" alt="${displayName}">
          <div class="title">${displayName}</div>
          <div class="price">THB ${displayPrice}</div>
          <div class="sku">SKU: ${sku}</div>
          <div class="stock">လက်ကျန်: ${displayStock} ခု</div>
          
          ${isAdmin ? `
            <button class="btn btn-edit" onclick="toggleEditBox('${sku}')">✏️ Edit</button>
            <div id="edit-box-${sku}" class="edit-form">
              <label>အမည်:</label>
              <input type="text" id="input-name-${sku}" value="${displayName}">
              <label>ဈေးနှုန်း (THB):</label>
              <input type="number" id="input-price-${sku}" value="${displayPrice}">
              <label>လက်ကျန် (Stock):</label>
              <input type="number" id="input-stock-${sku}" value="${displayStock}">
              <label>Image Direct Link:</label>
              <input type="text" id="input-img-${sku}" value="${custom.image_url || ''}" placeholder="https://...">
              <button class="btn btn-save" onclick="saveProduct('${sku}')">💾 Save</button>
            </div>
          ` : `
            <button class="btn btn-add-cart" onclick="addToCart('${sku}', '${safeName}', ${displayPrice})">🛒 ခြင်းထဲထည့်မည်</button>
          `}
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('load', loadDatabase);
  </script>
</body>
</html>
